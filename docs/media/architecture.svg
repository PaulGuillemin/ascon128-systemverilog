<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
  <title id="title">Ascon-128 iterative datapath</title>
  <desc id="desc">A Moore controller sequences an input mux and XOR stage, one permutation round, final key XOR and the 320-bit state register. The saved state feeds back to the input. Ciphertext and tag have dedicated output registers.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#444" stroke-width="1.2"/></marker></defs>
  <rect width="1100" height="380" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#222">
    <text x="24" y="32" font-size="20">Ascon-128 · iterative datapath</text>
    <g fill="none" stroke="#555" stroke-width="1.2">
      <rect x="370" y="59" width="310" height="51"/>
      <rect x="24" y="155" width="150" height="80"/>
      <rect x="225" y="155" width="190" height="80"/>
      <rect x="475" y="155" width="205" height="80"/>
      <rect x="740" y="155" width="135" height="80"/>
      <rect x="925" y="155" width="150" height="80"/>
    </g>
    <g font-size="16" font-weight="bold">
      <text x="386" y="81">Moore controller</text>
      <text x="40" y="183">Inputs</text>
      <text x="241" y="183">Input mux / XOR</text>
      <text x="491" y="183">Permutation round</text>
      <text x="756" y="183">Key XOR</text>
      <text x="941" y="183">State register</text>
    </g>
    <g font-size="14" fill="#555">
      <text x="386" y="100">Phase control · round counter</text>
      <text x="40" y="208">Data, key, nonce</text>
      <text x="241" y="208">Absorb / domain bit</text>
      <text x="491" y="208">Pc → Ps → Pl</text>
      <text x="756" y="208">Final round</text>
      <text x="941" y="208">5 × 64-bit words</text>
    </g>
    <g fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)">
      <path d="M174 195H218"/><path d="M415 195H468"/>
      <path d="M680 195H733"/><path d="M875 195H918"/>
      <path d="M1000 235V328H245V235"/>
      <path d="M320 235V267"/><path d="M810 235V267"/>
      <path d="M525 110V148" stroke-dasharray="4 3"/>
    </g>
    <g font-size="14" fill="#555">
      <text x="253" y="289">Ciphertext register</text>
      <text x="296" y="309">64 bits</text>
      <text x="772" y="289">Tag register</text>
      <text x="783" y="309">128 bits</text>
      <text x="525" y="350">Saved state</text>
      <text x="537" y="133">Enables and round index</text>
    </g>
  </g>
</svg>
